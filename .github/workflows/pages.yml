name: Publicar site

# O GitHub Pages deste repositório serve a branch gh-pages.
# Este workflow copia o site da main para lá a cada push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar a branch gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf assets index.html 404.html
          git checkout "$GITHUB_SHA" -- index.html 404.html assets
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no site."
            exit 0
          fi
          git commit -m "Publica site a partir de ${GITHUB_SHA:0:7}"
          git push origin gh-pages
